name: Publish approved email preview

on:
  workflow_dispatch:
    inputs:
      source_path: {description: "Repository-relative Shopify email HTML path", required: true, type: string}
      email_code: {description: "Canonical email code", required: true, type: string}
      commit_sha: {description: "Exact 40-character source commit SHA", required: true, type: string}
      issue: {description: "Related Email Issue number", required: true, type: number}
      pr: {description: "Related PR number", required: true, type: number}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: email-preview-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Enforce explicit publication gate
        env:
          SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(jq -r .preview_public tools/email-preview/preview-config.json)" = true || { echo "preview_public is not explicitly true" >&2; exit 1; }
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "exact source SHA required" >&2; exit 1; }
          git cat-file -e "$SHA^{commit}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/email-preview/package-lock.json
      - working-directory: tools/email-preview
        run: npm ci
      - working-directory: tools/email-preview
        run: npx playwright install --with-deps chromium
      - name: Render exact approved revision
        run: npm --prefix tools/email-preview run preview -- --source "${{ inputs.source_path }}" --email-code "${{ inputs.email_code }}" --commit-sha "${{ inputs.commit_sha }}" --issue "${{ inputs.issue }}" --pr "${{ inputs.pr }}" --out "email-previews/site/${{ inputs.email_code }}"
      - name: Build noindex gallery
        run: npm --prefix tools/email-preview run gallery -- email-previews/site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: email-previews/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

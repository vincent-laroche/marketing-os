name: Email preview review

on:
  pull_request:
    paths:
      - "shopify-messaging/emails/*.html"
      - "tools/email-preview/**"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/email-preview/package-lock.json
      - name: Install locked compiler
        working-directory: tools/email-preview
        run: npm ci
      - name: Install screenshot browser
        working-directory: tools/email-preview
        run: npx playwright install --with-deps chromium
      - name: Verify the compiler and its readiness report
        working-directory: tools/email-preview
        run: |
          npx tsc -p tsconfig.json --noEmit
          npm test
          npm run inventory -- --check
      - name: List changed emails
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'shopify-messaging/emails/*.html' > changed-emails.txt
          count="$(grep -c . changed-emails.txt || true)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed email sources: $count"
      - name: Render changed emails fail closed
        if: steps.changed.outputs.count != '0'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p email-previews/review
          while read -r source; do
            test -n "$source" || continue
            guess="$(basename "$source" .html | sed -E 's/^[0-9]+-//' | tr '[:lower:]' '[:upper:]')"
            # Casing comes from the manifest, never the filename: 13-pp-7b.html is PP-7b.
            code="$(jq -r --arg guess "$guess" '.issues | keys[] | select(startswith("email:")) | ltrimstr("email:") | select(ascii_upcase == $guess)' github-campaign-os/issue-sync-report.json)"
            test -n "$code" || { echo "No canonical Email Issue found for $guess" >&2; exit 1; }
            issue="$(jq -r --arg key "email:$code" '.issues[$key]' github-campaign-os/issue-sync-report.json)"
            npm --prefix tools/email-preview run preview -- --source "$source" --email-code "$code" --commit-sha "$HEAD_SHA" --issue "$issue" --pr "$PR" --out "email-previews/review/$code"
          done < changed-emails.txt
          test -n "$(find email-previews/review -name provenance.json -print -quit)" || { echo "No email preview was generated" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.changed.outputs.count != '0'
        with:
          name: email-preview-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: email-previews/review
          retention-days: 14
          if-no-files-found: error

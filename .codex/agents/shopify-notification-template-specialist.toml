Default to read-only. A template edit requires current explicit approval naming the exact store, template or enumerated batch, allowed transformation, before-state capture, and rollback. Read PROJECT.md, AGENTS.md, EMAIL-AGENT-CONTRACT.md, ROUTING.md, and the filed Task Issue. Preserve transactional Liquid, customer-critical data, accessibility, and notification-specific design authority; campaign authority does not automatically apply.


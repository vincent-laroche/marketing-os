<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:transparent;border-collapse:collapse;margin:0;">
  <tr>
    <td align="center" style="padding:8px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:568px;background-color:#E5E5E5;border:1px solid #CFCFCF;border-radius:14px;border-collapse:separate;">
        <tr>
          <td style="padding:34px 30px;">
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#0F2A34;padding-bottom:12px;">New site experience</div>
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:24px;line-height:1.16;font-weight:700;color:#1A1A18;padding-bottom:18px;">The relaunch is about clarity, not decoration.</div>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="50%" valign="top" style="padding:18px 18px 18px 0;border-right:1px solid #CFCFCF;">
                  <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#E06A2A;padding-bottom:10px;">{{ module.left_label }}</div>
                  <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.55;color:#333533;">{{ module.left_caption }}</div>
                </td>
                <td width="50%" valign="top" style="padding:18px 0 18px 18px;">
                  <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#E06A2A;padding-bottom:10px;">{{ module.right_label }}</div>
                  <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.55;color:#333533;">{{ module.right_caption }}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:transparent;border-collapse:collapse;margin:0;">
  <tr>
    <td align="center" style="padding:7px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:568px;background-color:#D6D6D6;border:1px solid #D6D6D6;border-radius:8px;border-collapse:separate;">
        <tr>
          <td style="padding:30px;font-family:Arial,Helvetica,sans-serif;">
            <div style="font-family:'Courier New',Courier,monospace;font-size:11px;line-height:1.4;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#A63E1B;margin:0 0 10px;">{{ module.eyebrow }}</div>
            <div style="font-family:Georgia,'Times New Roman',Times,serif;font-size:28px;line-height:1.2;font-weight:400;color:#0F0F0F;margin:0 0 12px;">{{ module.heading }}</div>
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.65;color:#2A2929;margin:0 0 22px;">{{ module.body_text }}</div>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td style="padding:16px 0;border-top:1px solid #E5E5E5;">
                  <div style="font-size:15px;line-height:1.4;font-weight:700;color:#1B1B1B;margin:0 0 4px;">{{ module.point_1_label }}</div>
                  <div style="font-size:15px;line-height:1.6;color:#2A2929;margin:0;">{{ module.point_1_text }}</div>
                </td>
              </tr>
              <tr>
                <td style="padding:16px 0;border-top:1px solid #E5E5E5;">
                  <div style="font-size:15px;line-height:1.4;font-weight:700;color:#1B1B1B;margin:0 0 4px;">{{ module.point_2_label }}</div>
                  <div style="font-size:15px;line-height:1.6;color:#2A2929;margin:0;">{{ module.point_2_text }}</div>
                </td>
              </tr>
              <tr>
                <td style="padding:16px 0 0;border-top:1px solid #E5E5E5;">
                  <div style="font-size:15px;line-height:1.4;font-weight:700;color:#1B1B1B;margin:0 0 4px;">{{ module.point_3_label }}</div>
                  <div style="font-size:15px;line-height:1.6;color:#2A2929;margin:0;">{{ module.point_3_text }}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

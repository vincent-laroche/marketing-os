<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:transparent;border-collapse:collapse;margin:0;">
  <tr>
    <td align="center" style="padding:7px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:568px;background-color:#D6D6D6;border:1px solid #D6D6D6;border-radius:8px;border-collapse:separate;">
        <tr>
          <td style="padding:30px;font-family:Arial,Helvetica,sans-serif;">
            <div style="font-family:'Courier New',Courier,monospace;font-size:11px;line-height:1.4;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#A63E1B;margin:0 0 10px;">{{ module.eyebrow }}</div>
            <div style="font-family:Georgia,'Times New Roman',Times,serif;font-size:27px;line-height:1.2;font-weight:400;color:#0F0F0F;margin:0 0 12px;">{{ module.heading }}</div>
            <div style="font-size:16px;line-height:1.65;color:#2A2929;margin:0 0 22px;">{{ module.body_text }}</div>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td valign="top" width="33.33%" style="width:33.33%;padding:0 8px 0 0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E5E5E5;border:1px solid #E5E5E5;border-radius:8px;border-collapse:separate;">
                    <tr><td style="padding:16px;"><div style="font-size:14px;font-weight:700;line-height:1.35;color:#0F0F0F;margin:0 0 8px;">{{ module.proof_1_label }}</div><div style="font-size:13px;line-height:1.55;color:#2A2929;margin:0;">{{ module.proof_1_text }}</div></td></tr>
                  </table>
                </td>
                <td valign="top" width="33.33%" style="width:33.33%;padding:0 4px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E5E5E5;border:1px solid #E5E5E5;border-radius:8px;border-collapse:separate;">
                    <tr><td style="padding:16px;"><div style="font-size:14px;font-weight:700;line-height:1.35;color:#0F0F0F;margin:0 0 8px;">{{ module.proof_2_label }}</div><div style="font-size:13px;line-height:1.55;color:#2A2929;margin:0;">{{ module.proof_2_text }}</div></td></tr>
                  </table>
                </td>
                <td valign="top" width="33.33%" style="width:33.33%;padding:0 0 0 8px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E5E5E5;border:1px solid #E5E5E5;border-radius:8px;border-collapse:separate;">
                    <tr><td style="padding:16px;"><div style="font-size:14px;font-weight:700;line-height:1.35;color:#0F0F0F;margin:0 0 8px;">{{ module.proof_3_label }}</div><div style="font-size:13px;line-height:1.55;color:#2A2929;margin:0;">{{ module.proof_3_text }}</div></td></tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

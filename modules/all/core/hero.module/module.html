<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:transparent;border-collapse:collapse;margin:0;">
  <tr>
    <td align="center" style="padding:7px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:568px;background-color:#E5E5E5;border:1px solid #D6D6D6;border-radius:8px;border-collapse:separate;">
        <tr>
          <td style="padding:38px 34px 34px;font-family:Arial,Helvetica,sans-serif;text-align:left;">
            <div style="width:44px;height:3px;background-color:#A63E1B;line-height:3px;font-size:0;margin:0 0 18px;">&nbsp;</div>
            <div style="font-family:'Courier New',Courier,monospace;font-size:11px;line-height:1.4;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#A63E1B;margin:0 0 12px;">{{ module.eyebrow }}</div>
            <div style="font-family:Georgia,'Times New Roman',Times,serif;font-size:34px;line-height:1.12;font-weight:400;color:#0F0F0F;margin:0 0 16px;">{{ module.heading }}</div>
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.65;color:#2A2929;margin:0 0 24px;">{{ module.body_text }}</div>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin:0 0 16px;">
              <tr>
                <td style="background-color:#0F0F0F;border-radius:4px;">
                  <a href="{{ module.primary_cta_url.href }}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:14px 26px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.2;font-weight:700;color:#E5E5E5;text-decoration:none;">{{ module.primary_cta_label }}</a>
                </td>
              </tr>
            </table>
            <div style="font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.5;color:#2A2929;margin:0;">{{ module.supporting_note }}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

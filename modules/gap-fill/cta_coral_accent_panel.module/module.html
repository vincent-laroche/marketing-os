<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:#ED6F5C;border-radius:16px;">
  <tr>
    <td align="center" style="padding:56px;font-family:Arial,Helvetica,sans-serif;text-align:center;">
      {% if module.heading %}
      <h2 style="margin:0 0 20px 0;font-family:'Inter Tight',Arial,Helvetica,sans-serif;font-size:30px;line-height:1.2;font-weight:800;color:#15140F;">{{ module.heading }}</h2>
      {% endif %}
      {% if module.body_text %}
      <div style="margin:0 auto 20px auto;max-width:460px;font-family:'Inter',Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#15140F;opacity:0.9;">{{ module.body_text }}</div>
      {% endif %}
      {% if module.cta_label and module.cta_url.href %}
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;"><tr><td style="border-radius:999px;background:#15140F;">
        <a href="{{ module.cta_url.href }}" style="display:inline-block;padding:18px 34px;font-family:'Inter Tight',Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;color:#F7F1DE;text-decoration:none;border-radius:999px;">{{ module.cta_label }} &rarr;</a>
      </td></tr></table>
      {% endif %}
    </td>
  </tr>
</table>

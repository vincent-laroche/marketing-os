{% set is_dark = module.theme == "dark" %}
{% set card_color = "#15140F" if is_dark else "#F7F1DE" %}
{% set text_color = "#F7F1DE" if is_dark else "#15140F" %}
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:{{ card_color }};border-radius:16px;">
  <tr>
    <td align="center" style="padding:40px;font-family:Arial,Helvetica,sans-serif;text-align:center;">
      {% if module.cta_label and module.cta_url.href %}
      <a href="{{ module.cta_url.href }}" style="display:inline-block;padding-bottom:4px;border-bottom:1px solid {{ text_color }};font-family:'Inter Tight',Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:{{ text_color }};text-decoration:none;">{{ module.cta_label }} &rarr;</a>
      {% endif %}
    </td>
  </tr>
</table>

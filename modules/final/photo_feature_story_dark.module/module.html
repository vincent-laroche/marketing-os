<style>@media only screen and (max-width:480px){.final-card{width:100%!important}.final-pad{padding:24px!important}.final-card td{box-sizing:border-box}}</style><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#181714;"><tr><td align="center" style="padding:16px;"><table role="presentation" class="final-card" width="568" cellpadding="0" cellspacing="0" border="0" style="width:568px;max-width:100%;background:#25221D;"><tr><td class="final-pad" style="padding:32px;font-family:Arial,Helvetica,sans-serif;color:#EDE3CC;font-size:16px;line-height:1.55;"><img src="{{ module.image.src }}" alt="{{ module.image.alt }}" width="504" style="display:block;width:100%;max-width:504px;height:auto;border:0;margin:0 0 24px;"><p style="margin:0 0 10px;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;">{{ module.eyebrow }}</p><h2 style="margin:0 0 16px;font-size:28px;line-height:1.15;">{{ module.heading }}</h2><div style="font-size:16px;line-height:1.55;">{{ module.body_text }}</div>{% if module.show_button == 'yes' %}<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px;"><tr><td style="background:#EA6452;border-radius:999px;padding:13px 22px;"><a href="{{ module.button_url.href }}" style="color:#151411;text-decoration:none;font-weight:bold;">{{ module.button_label }}</a></td></tr></table>{% endif %}</td></tr></table></td></tr></table>
